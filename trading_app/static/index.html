<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trading App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #e6edf3; --muted: #8b949e;
      --green: #3fb950; --red: #f85149; --blue: #58a6ff; --yellow: #d29922;
    }
    body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px; }

    header { display: flex; align-items: center; gap: 16px; padding: 12px 20px; background: var(--surface); border-bottom: 1px solid var(--border); }
    header h1 { font-size: 18px; font-weight: 700; color: var(--blue); }
    #ticker-select { background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 6px; padding: 4px 10px; font-size: 14px; cursor: pointer; }
    #live-price { font-size: 22px; font-weight: 700; margin-left: auto; }
    #price-change { font-size: 13px; margin-left: 8px; }

    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 0; height: calc(100vh - 53px); overflow: hidden; }
    .main-col { display: flex; flex-direction: column; gap: 0; overflow-y: auto; padding: 16px; }
    .side-col { display: flex; flex-direction: column; gap: 0; border-left: 1px solid var(--border); overflow-y: auto; }

    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 14px; margin-bottom: 14px; }
    .card h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }

    /* Chart */
    #chart-container { height: 320px; position: relative; }
    canvas#chart { width: 100%; height: 100%; }

    /* Metrics row */
    .metrics { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
    .metric { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 10px; }
    .metric .label { color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .05em; }
    .metric .value { font-size: 18px; font-weight: 700; margin-top: 4px; }

    /* Order form */
    .side-section { padding: 14px; border-bottom: 1px solid var(--border); }
    .side-section h2 { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; margin-bottom: 10px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 12px; }
    .tab { flex: 1; padding: 6px; text-align: center; border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 13px; border: 1px solid var(--border); background: var(--bg); color: var(--muted); transition: all .15s; }
    .tab.buy.active { background: var(--green); border-color: var(--green); color: #000; }
    .tab.sell.active { background: var(--red); border-color: var(--red); color: #fff; }
    .form-group { margin-bottom: 10px; }
    .form-group label { display: block; color: var(--muted); font-size: 12px; margin-bottom: 4px; }
    .form-group input, .form-group select {
      width: 100%; background: var(--bg); color: var(--text); border: 1px solid var(--border);
      border-radius: 6px; padding: 7px 10px; font-size: 13px;
    }
    .form-group input:focus, .form-group select:focus { outline: none; border-color: var(--blue); }
    .btn-place { width: 100%; padding: 10px; border: none; border-radius: 6px; font-size: 14px; font-weight: 700; cursor: pointer; transition: opacity .15s; }
    .btn-place:hover { opacity: .85; }
    .btn-place.buy { background: var(--green); color: #000; }
    .btn-place.sell { background: var(--red); color: #fff; }
    #order-msg { margin-top: 8px; font-size: 12px; min-height: 18px; }
    #order-msg.ok { color: var(--green); }
    #order-msg.err { color: var(--red); }

    /* Positions table */
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th { color: var(--muted); text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--border); font-weight: 600; text-transform: uppercase; font-size: 11px; }
    td { padding: 6px 8px; border-bottom: 1px solid var(--border); }
    .pos { color: var(--green); } .neg { color: var(--red); }

    /* Backtest */
    .bt-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .bt-form .form-group { margin-bottom: 0; }
    .btn-bt { grid-column: 1 / -1; width: 100%; padding: 9px; border: none; border-radius: 6px; background: var(--blue); color: #000; font-weight: 700; cursor: pointer; font-size: 13px; }
    .btn-bt:hover { opacity: .85; }
    #bt-results { margin-top: 12px; display: none; }
    .bt-metrics { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .bt-metric { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    .bt-metric .label { color: var(--muted); font-size: 11px; }
    .bt-metric .value { font-size: 15px; font-weight: 700; margin-top: 2px; }
  </style>
</head>
<body>
<header>
  <h1>📈 Trading App</h1>
  <select id="ticker-select">
    <option>AAPL</option><option>MSFT</option><option>GOOGL</option>
    <option>AMZN</option><option>NVDA</option><option>TSLA</option>
    <option>SPY</option><option>BTC-USD</option>
  </select>
  <div>
    <span id="live-price">—</span>
    <span id="price-change" style="color:var(--muted)">—</span>
  </div>
</header>

<div class="layout">
  <div class="main-col">
    <!-- Chart -->
    <div class="card">
      <h2>Price Chart</h2>
      <div id="chart-container"><canvas id="chart"></canvas></div>
    </div>

    <!-- Portfolio metrics -->
    <div class="card">
      <h2>Portfolio</h2>
      <div class="metrics">
        <div class="metric"><div class="label">Total Equity</div><div class="value" id="m-equity">—</div></div>
        <div class="metric"><div class="label">Cash</div><div class="value" id="m-cash">—</div></div>
        <div class="metric"><div class="label">Unrealized P&amp;L</div><div class="value" id="m-upnl">—</div></div>
        <div class="metric"><div class="label">Realized P&amp;L</div><div class="value" id="m-rpnl">—</div></div>
      </div>
    </div>

    <!-- Positions -->
    <div class="card">
      <h2>Open Positions</h2>
      <table>
        <thead><tr><th>Ticker</th><th>Qty</th><th>Avg Entry</th><th>Last</th><th>Mkt Value</th><th>Unr. P&amp;L</th></tr></thead>
        <tbody id="positions-body"><tr><td colspan="6" style="color:var(--muted);text-align:center">No open positions</td></tr></tbody>
      </table>
    </div>

    <!-- Backtest -->
    <div class="card">
      <h2>Strategy Backtest</h2>
      <div class="bt-form">
        <div class="form-group">
          <label>Strategy</label>
          <select id="bt-strategy"><option value="sma_cross">SMA Crossover</option><option value="rsi">RSI Mean Reversion</option></select>
        </div>
        <div class="form-group">
          <label>Bars</label>
          <input type="number" id="bt-bars" value="300" min="50" max="500" />
        </div>
        <div class="form-group">
          <label>Short Window / RSI Period</label>
          <input type="number" id="bt-short" value="10" min="2" />
        </div>
        <div class="form-group">
          <label>Long Window / Overbought</label>
          <input type="number" id="bt-long" value="50" min="5" />
        </div>
        <button class="btn-bt" onclick="runBacktest()">▶ Run Backtest</button>
      </div>
      <div id="bt-results">
        <div class="bt-metrics" id="bt-metrics"></div>
      </div>
    </div>
  </div>

  <!-- Side panel -->
  <div class="side-col">
    <div class="side-section">
      <h2>Place Order</h2>
      <div class="tabs">
        <div class="tab buy active" id="tab-buy" onclick="setOrderSide('BUY')">BUY</div>
        <div class="tab sell" id="tab-sell" onclick="setOrderSide('SELL')">SELL</div>
      </div>
      <div class="form-group">
        <label>Order Type</label>
        <select id="order-type" onchange="onOrderTypeChange()">
          <option value="MARKET">Market</option>
          <option value="LIMIT">Limit</option>
          <option value="STOP">Stop</option>
        </select>
      </div>
      <div class="form-group">
        <label>Quantity</label>
        <input type="number" id="order-qty" value="1" min="0.01" step="0.01" />
      </div>
      <div class="form-group" id="limit-group" style="display:none">
        <label>Limit Price</label>
        <input type="number" id="order-limit" placeholder="0.00" step="0.01" />
      </div>
      <div class="form-group" id="stop-group" style="display:none">
        <label>Stop Price</label>
        <input type="number" id="order-stop" placeholder="0.00" step="0.01" />
      </div>
      <button class="btn-place buy" id="order-btn" onclick="placeOrder()">Place BUY</button>
      <div id="order-msg"></div>
    </div>

    <div class="side-section">
      <h2>Recent Orders</h2>
      <table>
        <thead><tr><th>Side</th><th>Ticker</th><th>Qty</th><th>Price</th><th>Status</th></tr></thead>
        <tbody id="orders-body"><tr><td colspan="5" style="color:var(--muted);text-align:center">No orders yet</td></tr></tbody>
      </table>
    </div>
  </div>
</div>

<script src="/static/app.js"></script>
</body>
</html>
